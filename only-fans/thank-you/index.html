<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — Only Fans | Lifestyle Alchemist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --blush:#f7e6e4;
    --lilac:#e8def0;
    --mint:#dcf0e6;
    --plum:#4a2b3d;
    --gold:#c9995f;
    --line: rgba(74,43,61,0.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    min-height:100vh;
    background:linear-gradient(180deg,var(--blush) 0%, var(--lilac) 50%, var(--mint) 100%);
    color:var(--plum);font-family:'Inter',sans-serif;line-height:1.6;
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  h1,h2{font-family:'Fraunces',serif;font-weight:500;}
  a{color:inherit;text-decoration:none;}
  .card{
    max-width:480px;width:100%;text-align:center;
    background:#fff;border:1px solid var(--line);border-radius:6px;
    padding:56px 40px;
  }
  .glyph{font-size:2.8rem;}
  h1{font-size:1.9rem;margin-top:18px;}
  .sub{color:var(--gold);font-family:'Fraunces',serif;font-style:italic;font-size:1rem;margin-top:6px;}
  p{margin-top:20px;color:rgba(74,43,61,0.7);font-size:0.95rem;}
  .cta{
    display:inline-block;margin-top:32px;
    background:var(--plum);color:var(--blush);
    padding:15px 30px;border-radius:999px;font-size:0.88rem;font-weight:600;
  }
  .cta:hover{background:var(--gold);color:var(--plum);}
  .whatsapp-link{display:block;margin-top:16px;font-size:0.85rem;color:var(--plum);opacity:0.75;}
</style>
</head>
<body>

<div class="card">
  <div class="glyph">🪭</div>
  <h1>Thank you for your order!</h1>
  <div class="sub">Your payment is on its way to us</div>
  <p>We've received your PayFast payment confirmation. We'll be in touch shortly on WhatsApp to confirm your design pick and arrange collection or delivery.</p>
  <a class="cta" href="../">Back to Only Fans</a>
  <a class="whatsapp-link" href="https://wa.me/27794998013">Questions? Message us on WhatsApp →</a>
</div>

</body>
</html>
